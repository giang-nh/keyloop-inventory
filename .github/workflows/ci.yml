name: CI

# GitHub-hosted runners are not available on this account (billing), so this workflow
# only runs when started by hand. The same checks run locally before every push through
# the pre-push hook in .githooks/. To run CI on every push again, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
