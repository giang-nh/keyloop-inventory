[project]
name = "keyloop-inventory"
version = "0.1.0"
description = "Backend service that helps dealership managers find and act on aging vehicle stock."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Treat warnings as errors, so deprecated APIs are caught early.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
